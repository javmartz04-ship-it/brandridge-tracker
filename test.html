<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Tracker Test</title>
<script async src="./t.js" data-client="tracker-test" data-step="test" data-identify="off"></script>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #111; }
  section { min-height: 90vh; padding: 48px 16px; border-bottom: 1px solid #eee; max-width: 760px; margin: 0 auto; }
  video, iframe { width: 100%; aspect-ratio: 16/9; border: 0; background: #000; }
  .btn { display: inline-block; padding: 14px 22px; background: #111; color: #fff; text-decoration: none; border-radius: 8px; }
</style>
</head>
<body>
<section id="hero">
  <h1>Tracker Test Page</h1>
  <p>Internal page for checking the Brandridge tracker. Not a client funnel.</p>
  <video id="vsl" controls playsinline preload="metadata" src="https://javmartz04-ship-it.github.io/jd-strategic-call/assets/vsl/preview.mp4"></video>
  <p><a class="btn" href="#book">Book My Call</a></p>
</section>
<section id="youtube"><h2>YouTube</h2><iframe src="https://www.youtube-nocookie.com/embed/jEWU5pLuM4k" allow="autoplay; encrypted-media" allowfullscreen></iframe></section>
<section id="vimeo"><h2>Vimeo</h2><iframe src="https://player.vimeo.com/video/76979871" allow="autoplay; fullscreen" allowfullscreen></iframe></section>
<section id="book">
  <h2>Form</h2>
  <form id="optin" onsubmit="event.preventDefault()">
    <input name="first_name" placeholder="First name">
    <input type="email" name="email" placeholder="Email">
    <button type="submit">Book My Call</button>
  </form>
</section>
</body>
</html>
